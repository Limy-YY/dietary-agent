services:
  db:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: diet-agent-db:v1.2r1
    container_name: diet-agent-db
    environment:
      POSTGRES_DB: diet_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diet_agent"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  pgdata: